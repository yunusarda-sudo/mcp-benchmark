name: 'MCP Benchmark'
description: 'Deterministic quality benchmark and linter for Model Context Protocol (MCP) tool definitions'
author: 'Yunus Arda Güney'
inputs:
  file:
    description: 'Path to a JSON file containing tool definitions'
    required: false
  cmd:
    description: 'Command to launch a local MCP server over stdio'
    required: false
  url:
    description: 'Remote MCP SSE/HTTP endpoint'
    required: false
  config:
    description: 'Path to an MCP configuration file (e.g. claude_desktop_config.json)'
    required: false
  baseline:
    description: 'Path to baseline tool catalog for PR diff and breaking change checks'
    required: false
  fail-under:
    description: 'Fail if minimum TQI score is below this threshold (0-100)'
    required: false
  fail-on:
    description: 'Fail on critical, high, or breaking changes'
    required: false
  sarif:
    description: 'Output file path for SARIF v2.1.0 report'
    required: false
  badge:
    description: 'Output file path for SVG quality badge'
    required: false
  cost:
    description: 'Estimate context window token consumption and financial cost'
    required: false
  pr-comment:
    description: 'Output file path for GitHub PR comment markdown summary'
    required: false
  html:
    description: 'Output file path for standalone HTML report'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Run MCP Benchmark
      shell: bash
      run: |
        ARGS=()
        if [ -n "${{ inputs.file }}" ]; then ARGS+=(--file "${{ inputs.file }}"); fi
        if [ -n "${{ inputs.cmd }}" ]; then ARGS+=(--cmd "${{ inputs.cmd }}"); fi
        if [ -n "${{ inputs.url }}" ]; then ARGS+=(--url "${{ inputs.url }}"); fi
        if [ -n "${{ inputs.config }}" ]; then ARGS+=(--config "${{ inputs.config }}"); fi
        if [ -n "${{ inputs.baseline }}" ]; then ARGS+=(--baseline "${{ inputs.baseline }}"); fi
        if [ -n "${{ inputs.fail-under }}" ]; then ARGS+=(--fail-under "${{ inputs.fail-under }}"); fi
        if [ -n "${{ inputs.fail-on }}" ]; then ARGS+=(--fail-on "${{ inputs.fail-on }}"); fi
        if [ -n "${{ inputs.sarif }}" ]; then ARGS+=(--sarif "${{ inputs.sarif }}"); fi
        if [ -n "${{ inputs.badge }}" ]; then ARGS+=(--badge "${{ inputs.badge }}"); fi
        if [ "${{ inputs.cost }}" = "true" ]; then ARGS+=(--cost); fi
        if [ -n "${{ inputs.pr-comment }}" ]; then ARGS+=(--pr-comment "${{ inputs.pr-comment }}"); fi
        if [ -n "${{ inputs.html }}" ]; then ARGS+=(--html "${{ inputs.html }}"); fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${ARGS[@]}"

branding:
  icon: 'check-circle'
  color: 'blue'
