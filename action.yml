name: 'MCP Benchmark'
description: 'Deterministic quality benchmark and linter for Model Context Protocol (MCP) tool definitions'
author: 'Yunus Arda Güney'
inputs:
  file:
    description: 'Path to a JSON file containing tool definitions'
    required: false
  cmd:
    description: 'Command to launch a local MCP server over stdio'
    required: false
  url:
    description: 'Remote MCP SSE/HTTP endpoint'
    required: false
  config:
    description: 'Path to an MCP configuration file (e.g. claude_desktop_config.json)'
    required: false
  baseline:
    description: 'Path to baseline tool catalog for PR diff and breaking change checks'
    required: false
  fail-under:
    description: 'Fail if minimum TQI score is below this threshold (0-100)'
    required: false
  fail-on:
    description: 'Fail on critical, high, or breaking changes'
    required: false
  sarif:
    description: 'Output file path for SARIF v2.1.0 report'
    required: false
  badge:
    description: 'Output file path for SVG quality badge'
    required: false
  cost:
    description: 'Estimate context window token consumption and financial cost'
    required: false
  pr-comment:
    description: 'Output file path for GitHub PR comment markdown summary'
    required: false
  html:
    description: 'Output file path for standalone HTML report'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Run MCP Benchmark
      shell: bash
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_CMD: ${{ inputs.cmd }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_BADGE: ${{ inputs.badge }}
        INPUT_COST: ${{ inputs.cost }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
        INPUT_HTML: ${{ inputs.html }}
      run: |
        ARGS=()
        if [ -n "${INPUT_FILE}" ]; then ARGS+=(--file "${INPUT_FILE}"); fi
        if [ -n "${INPUT_CMD}" ]; then ARGS+=(--cmd "${INPUT_CMD}"); fi
        if [ -n "${INPUT_URL}" ]; then ARGS+=(--url "${INPUT_URL}"); fi
        if [ -n "${INPUT_CONFIG}" ]; then ARGS+=(--config "${INPUT_CONFIG}"); fi
        if [ -n "${INPUT_BASELINE}" ]; then ARGS+=(--baseline "${INPUT_BASELINE}"); fi
        if [ -n "${INPUT_FAIL_UNDER}" ]; then ARGS+=(--fail-under "${INPUT_FAIL_UNDER}"); fi
        if [ -n "${INPUT_FAIL_ON}" ]; then ARGS+=(--fail-on "${INPUT_FAIL_ON}"); fi
        if [ -n "${INPUT_SARIF}" ]; then ARGS+=(--sarif "${INPUT_SARIF}"); fi
        if [ -n "${INPUT_BADGE}" ]; then ARGS+=(--badge "${INPUT_BADGE}"); fi
        if [ "${INPUT_COST}" = "true" ]; then ARGS+=(--cost); fi
        if [ -n "${INPUT_PR_COMMENT}" ]; then ARGS+=(--pr-comment "${INPUT_PR_COMMENT}"); fi
        if [ -n "${INPUT_HTML}" ]; then ARGS+=(--html "${INPUT_HTML}"); fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${ARGS[@]}"

branding:
  icon: 'check-circle'
  color: 'blue'
