name: 🚀 Submit an MCP Server to the Leaderboard
description: Add your official or community Model Context Protocol (MCP) server to the Benchmark Leaderboard
title: "[Server Submission]: <Server Name>"
labels: ["server-submission", "ecosystem"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting your MCP server to the **Model Context Protocol Benchmark Leaderboard**!
        Fill out this form, or open a Pull Request directly adding your server JSON to `registry/servers/<slug>.json`.
  - type: input
    id: server_name
    attributes:
      label: MCP Server Name
      description: What is the official name of the MCP server?
      placeholder: "e.g. Supabase MCP, Linear MCP"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Ecosystem Category
      description: Select the category that best describes your server
      options:
        - "Developer Tools & VCS"
        - "Databases & Storage"
        - "Vector DBs & AI Search"
        - "Productivity & Notes"
        - "Communication & Alerting"
        - "Cloud & Hosting Platforms"
        - "Observability & Analytics"
        - "Web Scraping & Automation"
        - "Payments, CRM & Finance"
        - "Social, Media & Knowledge"
        - "Security & Identity"
        - "Other"
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: Public GitHub or GitLab repository link
      placeholder: "https://github.com/..."
    validations:
      required: true
  - type: textarea
    id: tools_json
    attributes:
      label: Tool Definitions (JSON)
      description: Paste the JSON output of `tools/list` or an array of tool definitions.
      placeholder: |
        [
          {
            "name": "my_tool",
            "description": "Clear imperative description of what this tool executes.",
            "inputSchema": {
              "type": "object",
              "properties": {
                "arg1": { "type": "string", "description": "Parameter details" }
              },
              "required": ["arg1"]
            }
          }
        ]
    validations:
      required: true
