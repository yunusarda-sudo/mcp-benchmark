name: 📐 Propose a New Linter / Benchmark Rule
description: Suggest a new schema, security, efficiency, or semantic quality check
title: "[Rule Proposal]: <Rule Name or ID>"
labels: ["rule-proposal", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome community proposals for new diagnostic and benchmark rules!
        Review existing rules with `mcp-benchmark --rules` before proposing.
  - type: input
    id: rule_id
    attributes:
      label: Proposed Rule ID
      description: Follow the domain.subdomain format (e.g. `schema.strict-date-format`, `security.dangerous-exec`)
      placeholder: "e.g. schema.strict-enum-descriptions"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Rule Category
      options:
        - "schema"
        - "security"
        - "semantic"
        - "naming"
        - "efficiency"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Default Severity
      options:
        - "critical"
        - "high"
        - "warning"
        - "info"
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale & Failure Mode
      description: Why does this rule improve LLM tool selection or runtime safety?
      placeholder: "LLMs frequently fail when..."
    validations:
      required: true
  - type: textarea
    id: example_tool
    attributes:
      label: Example Failing / Passing Tool Definitions
      description: Provide a minimal JSON snippet illustrating when this rule should trigger.
    validations:
      required: true
