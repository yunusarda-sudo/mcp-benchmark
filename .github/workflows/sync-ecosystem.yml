name: Sync MCP Registry Leaderboard & Auto-Deploy

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Ignore lastSync and rescan the whole registry'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: registry-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: bot/ecosystem-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      has_changes: ${{ steps.commit_push.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync from the MCP Registry
        env:
          FULL_SYNC: ${{ inputs.full_sync && '1' || '' }}
        run: node scripts/sync-registry.mjs

      - name: Rebuild and confirm dist matches source
        run: |
          npm run build
          git diff --exit-code -- dist

      - name: Test
        run: npm test

      - name: Commit, push to main and update pull request fallback
        id: commit_push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add registry/ fixtures/ docs/ README.md LEADERBOARD.md
          if git diff --cached --quiet; then
            echo "Registry data is unchanged."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ecosystem): sync MCP Registry leaderboard [skip ci]"

          # Attempt direct push to main so GitHub Pages gets auto-updated
          if git push origin main; then
            echo "Successfully committed and pushed updates directly to main."
          else
            echo "Direct push to main was rejected; falling back to PR..."
            git switch -C "$SYNC_BRANCH"
            git fetch origin "+refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" || true
            git push --force-with-lease origin "$SYNC_BRANCH"

            {
              echo "Automated sync of auth-free remote servers from the official MCP Registry (live \`tools/list\`)."
              echo
              echo '```json'
              cat registry/sync-state.json
              echo '```'
              echo
              echo "Generated by \`.github/workflows/sync-ecosystem.yml\`. Build and tests passed in the workflow run before this PR was opened."
            } > "$RUNNER_TEMP/pr-body.md"

            existing="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number')"
            if [ -n "$existing" ]; then
              gh pr edit "$existing" --body-file "$RUNNER_TEMP/pr-body.md"
              echo "Updated PR #$existing"
            else
              gh pr create --base main --head "$SYNC_BRANCH" \
                --title "chore(data): sync MCP Registry leaderboard" \
                --body-file "$RUNNER_TEMP/pr-body.md"
            fi
          fi

  deploy-pages:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
