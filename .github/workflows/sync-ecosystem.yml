name: Sync MCP Registry Leaderboard

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Ignore lastSync and rescan the whole registry'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: bot/ecosystem-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync from the MCP Registry
        env:
          FULL_SYNC: ${{ inputs.full_sync && '1' || '' }}
        run: node scripts/sync-registry.mjs

      - name: Rebuild and confirm dist matches source
        run: |
          npm run build
          git diff --exit-code -- dist

      - name: Test
        run: npm test

      - name: Open or update the sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add registry/ fixtures/ docs/ README.md
          if git diff --cached --quiet; then
            echo "Registry data is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"
          git commit -m "chore(data): sync MCP Registry leaderboard"

          # The bot branch is regenerated from main on every run, so it is replaced
          # (lease-protected) rather than appended to. main is never pushed.
          git fetch origin "+refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" || true
          git push --force-with-lease origin "$SYNC_BRANCH"

          {
            echo "Automated sync of auth-free remote servers from the official MCP Registry (live \`tools/list\`)."
            echo
            echo '```json'
            cat registry/sync-state.json
            echo '```'
            echo
            echo "Generated by \`.github/workflows/sync-ecosystem.yml\`. Build and tests passed in the workflow run before this PR was opened."
          } > "$RUNNER_TEMP/pr-body.md"

          existing="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated PR #$existing"
          else
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "chore(data): sync MCP Registry leaderboard" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
