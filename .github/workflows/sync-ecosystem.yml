name: 🔄 Sync MCP Ecosystem & Leaderboard

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-ecosystem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Discover and Sync New MCP Servers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-new-servers.mjs

      - name: Run Test Suite
        run: npm test

      - name: Commit and Push Changes if New Servers Discovered
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/ fixtures/ docs/ README.md
          if git diff --staged --quiet; then
            echo "No new servers or updates found this week."
          else
            git commit -m "chore(ecosystem): sync newly released MCP servers and update leaderboard"
            git push origin main
          fi
